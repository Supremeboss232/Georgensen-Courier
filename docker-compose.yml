version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: georgensen-db
    environment:
      POSTGRES_USER: georgensen
      POSTGRES_PASSWORD: georgensen_password
      POSTGRES_DB: georgensen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georgensen"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: georgensen-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://georgensen:georgensen_password@db:5432/georgensen
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      PYTHONPATH: /app/backend
      DEBUG: "False"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    container_name: georgensen-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: georgensen-celery-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      - redis
      - db
    environment:
      DATABASE_URL: postgresql://georgensen:georgensen_password@db:5432/georgensen
      PYTHONPATH: /app/backend
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app/backend

  celery_beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: georgensen-celery-beat
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      - redis
      - db
    environment:
      DATABASE_URL: postgresql://georgensen:georgensen_password@db:5432/georgensen
      PYTHONPATH: /app/backend
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app/backend

  nginx:
    image: nginx:alpine
    container_name: georgensen-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: georgensen-network
