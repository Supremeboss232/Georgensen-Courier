<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Georgensen Courier</title>
    <link rel="stylesheet" href="/assets/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/lib/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body.reset-password-page {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .reset-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .reset-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 460px;
            width: 100%;
        }
        .reset-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            border-radius: 10px 10px 0 0;
            text-align: center;
        }
        .btn-reset {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            color: white;
        }
    </style>
</head>
<body class="reset-password-page">
    <div class="reset-container">
        <div class="reset-card">
            <div class="reset-header">
                <h1>🚚 Georgensen</h1>
                <p>Set New Password</p>
            </div>
            <div class="card-body p-4">
                <div id="resetAlert" class="alert" style="display: none;"></div>
                <form id="resetPasswordForm">
                    <div class="mb-3">
                        <label for="resetToken" class="form-label fw-bold">Reset Token</label>
                        <input type="text" class="form-control" id="resetToken" placeholder="Paste token from email" required>
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label fw-bold">New Password</label>
                        <input type="password" class="form-control" id="newPassword" placeholder="Minimum 8 characters" minlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label fw-bold">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat new password" minlength="8" required>
                    </div>
                    <button type="submit" class="btn btn-reset w-100 mt-2" id="resetBtn">Reset Password</button>
                </form>
                <div class="text-center mt-4 pt-3 border-top">
                    <a href="/auth/login" class="text-decoration-none fw-bold">Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/core/api.js"></script>
    <script src="/js/core/auth.js"></script>
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const tokenParam = params.get('token');
            if (tokenParam) {
                document.getElementById('resetToken').value = tokenParam;
            }

            document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const alertEl = document.getElementById('resetAlert');
                const token = document.getElementById('resetToken').value.trim();
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (newPassword !== confirmPassword) {
                    alertEl.className = 'alert alert-danger';
                    alertEl.textContent = 'Passwords do not match.';
                    alertEl.style.display = 'block';
                    return;
                }

                try {
                    await post('/auth/reset-password', { token, new_password: newPassword });
                    alertEl.className = 'alert alert-success';
                    alertEl.textContent = 'Password reset successfully! Redirecting to login...';
                    alertEl.style.display = 'block';
                    setTimeout(() => { window.location.href = '/auth/login'; }, 1800);
                } catch (err) {
                    alertEl.className = 'alert alert-danger';
                    alertEl.textContent = err.message || 'Invalid or expired reset token.';
                    alertEl.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
