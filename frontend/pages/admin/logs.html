<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Audit & Chain of Custody Logs - Admin | Georgensen Courier</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/assets/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/lib/fontawesome/css/all.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="/admin/dashboard.html">🚚 Georgensen Admin</a>
        <div class="ms-auto d-flex gap-3 align-items-center">
            <a class="text-light text-decoration-none" href="/admin/dashboard.html">Dashboard</a>
            <a class="text-light text-decoration-none" href="/admin/orders.html">Orders</a>
            <a class="text-light text-decoration-none" href="/admin/partners.html">Partners</a>
            <a class="text-light text-decoration-none" href="/admin/disputes.html">Disputes</a>
            <a class="text-light text-decoration-none" href="/admin/reports.html">Reports</a>
            <a class="text-light text-decoration-none" href="/admin/settings.html">Settings</a>
            <a class="text-light text-decoration-none fw-bold" href="/admin/logs.html">System Logs</a>
            <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Security & Chain-of-Custody Audit Logs</h3>
            <div class="d-flex gap-2">
                <select id="logTypeFilter" class="form-select form-select-sm" onchange="loadAuditLogs()">
                    <option value="all">All Logs</option>
                    <option value="auth">Authentication Logs</option>
                    <option value="logistics">Logistics Chain of Custody</option>
                </select>
                <button class="btn btn-sm btn-primary" onclick="loadAuditLogs()">Refresh</button>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Log ID</th>
                            <th>Type</th>
                            <th>Action</th>
                            <th>Actor</th>
                            <th>Source / IP</th>
                            <th>Status</th>
                            <th>Details</th>
                            <th>Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <tr><td colspan="8" class="text-center py-4">Loading audit logs...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/core/api.js"></script>
    <script src="/js/core/auth.js"></script>
    <script src="/js/core/guards.js"></script>
    <script src="/js/main.js"></script>
    <script>
        async function loadAuditLogs() {
            const tbody = document.getElementById('logsTableBody');
            const logType = document.getElementById('logTypeFilter').value;
            try {
                const res = await getWithAuth(`/admin/logs?log_type=${encodeURIComponent(logType)}`);
                const logs = res.logs || [];
                if (!logs.length) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">No audit logs found.</td></tr>';
                    return;
                }
                tbody.innerHTML = logs.map(l => `
                    <tr>
                        <td><code>${l.id}</code></td>
                        <td><span class="badge bg-${l.type === 'auth' ? 'info' : 'primary'}">${l.type}</span></td>
                        <td><strong>${l.action}</strong></td>
                        <td>${l.actor_id ?? 'System'}</td>
                        <td><code>${l.ip_address || 'N/A'}</code></td>
                        <td><span class="badge bg-${l.status === 'failed' ? 'danger' : 'success'}">${l.status}</span></td>
                        <td>${l.details || ''}</td>
                        <td><small>${new Date(l.timestamp).toLocaleString()}</small></td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger py-4">${err.message}</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAdmin()) return;
            loadAuditLogs();
        });
    </script>
</body>
</html>
